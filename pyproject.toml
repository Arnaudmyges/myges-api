[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "myges-api"
dynamic = ["version"]
description = "Client Python typé (sync + async), CLI et spécification OpenAPI de l'API myGES / Kordis (non officielle)."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Arnaudmyges" }]
keywords = ["myges", "kordis", "skolae", "esgi", "openapi", "swagger"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Natural Language :: French",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "tzdata; sys_platform == 'win32'",  # base des fuseaux horaires, absente sous Windows
]

[project.optional-dependencies]
cli = ["typer>=0.12", "rich>=13"]
gcal = ["google-auth>=2.20"]

[project.scripts]
myges = "myges.cli:main"

[project.urls]
Homepage = "https://arnaudmyges.github.io/myges-api/"
Documentation = "https://arnaudmyges.github.io/myges-api/docs/"
Source = "https://github.com/Arnaudmyges/myges-api"

[dependency-groups]
dev = [
    "myges-api[cli,gcal]",
    "pytest>=8",
    "respx>=0.21",
    "anyio>=4",
    "jsonschema>=4.18",
    "openapi-spec-validator>=0.7",
    "pyyaml>=6",
    "types-PyYAML",
    "ruff>=0.6",
    "mypy>=1.10",
]

[tool.hatch.version]
path = "src/myges/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/myges"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "openapi", "README.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -m 'not live'"
markers = [
    "live: appelle la vraie API (MYGES_USERNAME/MYGES_PASSWORD requis) ; lancer avec -m live",
]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "PT", "C4"]
ignore = ["RUF001", "RUF002", "RUF003"]  # typographie française (’, «, », –) volontaire

[tool.mypy]
strict = true
python_version = "3.10"
files = ["src"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# google-auth n'annote pas toutes ses fonctions.
module = ["myges.gcal"]
disallow_untyped_calls = false
